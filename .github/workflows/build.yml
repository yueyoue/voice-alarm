name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set +e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "SDK dir: $SDK"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          SM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1
            if [ ! -d "$SDK/platforms/android-34" ]; then "$SM" "platforms;android-34"; fi
            if [ ! -d "$SDK/build-tools/34.0.0" ]; then "$SM" "build-tools;34.0.0"; fi
          fi
          echo "--- after ensure ---"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-alarm-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30