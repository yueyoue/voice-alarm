plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yueyoue.voicealarm'
    compileSdk 34

    defaultConfig {
        applicationId "com.yueyoue.voicealarm"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // 与 debug 使用同一签名，保证 CI 产出的 release APK 可直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}